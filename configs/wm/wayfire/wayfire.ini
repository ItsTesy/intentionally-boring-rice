[core]
plugins = autostart command decoration move place resize session-lock simple-tile vswitch wm-actions
background_color = 0.0 0.0 0.0 1.0
preferred_decoration_mode = server
vwidth = 3
vheight = 3
close_top_view = <super> <shift> KEY_Q
exit = <super> <shift> KEY_E

[decoration]
border_size = 1
title_height = 0
active_color = 0.290 0.290 0.290 1.0
inactive_color = 0.165 0.165 0.165 1.0

[simple-tile]
tile_by_default = all
inner_gap_size = 0
outer_horiz_gap_size = 0
outer_vert_gap_size = 0
animation_duration = 0
key_toggle = <super> <shift> KEY_SPACE
key_toggle_maximized = none
key_focus_left = <super> KEY_H
key_focus_below = <super> KEY_J
key_focus_above = <super> KEY_K
key_focus_right = <super> KEY_L
preview_base_color = 0.165 0.165 0.165 1.0
preview_base_border = 0.290 0.290 0.290 1.0
preview_border_width = 1

[wm-actions]
toggle_fullscreen = <super> KEY_F

[vswitch]
duration = 0
gap = 0
background = 0.0 0.0 0.0 1.0
binding_left = none
binding_right = none
binding_up = none
binding_down = none
with_win_left = none
with_win_right = none
with_win_up = none
send_win_left = <super> <shift> KEY_H
send_win_down = <super> <shift> KEY_J
send_win_up = <super> <shift> KEY_K
send_win_right = <super> <shift> KEY_L
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9
send_win_1 = <super> <shift> KEY_1
send_win_2 = <super> <shift> KEY_2
send_win_3 = <super> <shift> KEY_3
send_win_4 = <super> <shift> KEY_4
send_win_5 = <super> <shift> KEY_5
send_win_6 = <super> <shift> KEY_6
send_win_7 = <super> <shift> KEY_7
send_win_8 = <super> <shift> KEY_8
send_win_9 = <super> <shift> KEY_9

[command]
binding_term = <super> KEY_ENTER
command_term = @TERM@
binding_menu = <super> KEY_D
command_menu = @MENU@
binding_shot = KEY_SYSRQ
command_shot = @SHOT@
binding_reload = <super> <shift> KEY_C
command_reload = touch ~/.config/wayfire/wayfire.ini

[autostart]
autostart_wf_shell = false
ibr = ~/.config/ibr/autostart
