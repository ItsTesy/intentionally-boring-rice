[colors]
bg = #101010
fg = #b8b8b8
dim = #6a6a6a
focus = #4a4a4a
critical = #a04040

[bar/ibr]
width = 100%
height = 22
radius = 0
border-size = 0
line-size = 1
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=10;2
padding = 1
module-margin = 1
modules-left = xworkspaces
modules-right = time

[module/i3]
type = internal/i3
index-sort = true
pin-workspaces = true
enable-scroll = false
label-focused = %name%
label-focused-foreground = ${colors.fg}
label-focused-underline = ${colors.focus}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.dim}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.critical}
label-urgent-padding = 1

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-scroll = false
label-focused = %name%
label-focused-foreground = ${colors.fg}
label-focused-underline = ${colors.focus}
label-focused-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.dim}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.critical}
label-urgent-padding = 1

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = false
enable-scroll = false
format = <label-state>
label-active = %name%
label-active-foreground = ${colors.fg}
label-active-underline = ${colors.focus}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.dim}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.critical}
label-urgent-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
interval = 5
use-ui-max = false
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.dim}

[module/battery]
type = internal/battery
# BAT0 is BAT1 on some laptops
battery = BAT0
adapter = ADP1
full-at = 99
low-at = 15
poll-interval = 30
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
label-low-foreground = ${colors.critical}

[module/time]
type = internal/date
interval = 30
time = %H:%M
label = %time%

[module/date]
type = internal/date
interval = 60
date = %Y-%m-%d
label = %date%
