[window]
padding = { x = 10, y = 10 }
decorations = "None"
opacity = 1.0
dynamic_title = false

[scrolling]
history = 10000

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor.style]
shape = "Block"
blinking = "Off"

[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#101010"
foreground = "#b8b8b8"

# red and green readable for diffs
[colors.normal]
black   = "#2a2a2a"
red     = "#8a4a4a"
green   = "#5a7a5a"
yellow  = "#8a8a8a"
blue    = "#6a6a6a"
magenta = "#7a7a7a"
cyan    = "#8a8a8a"
white   = "#b8b8b8"

[colors.bright]
black   = "#4a4a4a"
red     = "#a04040"
green   = "#6f8f6f"
yellow  = "#a8a8a8"
blue    = "#8a8a8a"
magenta = "#9a9a9a"
cyan    = "#a8a8a8"
white   = "#f0f0f0"
